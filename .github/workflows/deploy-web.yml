name: Validate Web Build

on:
  push:
    branches: [main]
    paths:
      - 'packages/web/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# This job only validates that the web app builds. AWS Amplify performs the
# actual deploy using the committed amplify.yml build spec (repo root).
jobs:
  validate:
    name: Validate web build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Build web app
        env:
          EXPO_PUBLIC_API_URL: https://api.irondog.fit
          # EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID will be set in Amplify console
        run: npm run build:web --workspace=@irondog/web
      
      - name: Verify build output
        run: |
          if [ ! -d "packages/web/dist" ]; then
            echo "❌ Error: Web build failed - dist directory not found"
            exit 1
          fi
          echo "✅ Web build validation successful"
          echo ""
          echo "🚀 AWS Amplify handles the actual deployment:"
          echo "- Amplify fetches the repo and builds using amplify.yml (repo root)"
          echo "- Build spec: npm ci --legacy-peer-deps → npm run build:web --workspace=@irondog/web"
          echo "- Serves static output from packages/web/dist/"
          echo "- Auto-deploys on push to main branch"
          echo ""
          echo "One-time Amplify console setup:"
          echo "1. Create app → connect GitHub repo, branch main"
          echo "2. Root directory: /, build image: Node 20"
          echo "3. Env vars: EXPO_PUBLIC_API_URL, EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID"
          echo "4. Domain management: irondog.fit (Amplify provisions SSL)"
          echo "5. Add https://irondog.fit redirect URI to Google OAuth client"
          echo "6. Allow https://irondog.fit (and *.amplifyapp.com) as CORS origin on the API"
