name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'packages/api/**'
      - 'packages/shared/**'
      - 'infra/api-stack.yml'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:  # Allow manual trigger

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy API to AWS Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build and bundle API
        run: |
          npm run build --workspace=@irondog/api
          npm run bundle --workspace=@irondog/api

      - name: Package Lambda bundle
        run: |
          cd packages/api/dist
          rm -f ../../../api-lambda.zip
          zip ../../../api-lambda.zip index.js index.js.map
          cd ../../..
          ls -lh api-lambda.zip

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Deploy Lambda code
        run: |
          if aws lambda get-function --function-name irondog-api --query Configuration.FunctionName --output text 2>/dev/null; then
            aws lambda update-function-code --function-name irondog-api --zip-file fileb://api-lambda.zip --output text --query LastModified
          else
            echo "❌ Function irondog-api not found."
            echo "   Deploy the infra stack first:"
            echo "   aws cloudformation deploy --region us-west-2 \\"
            echo "     --template-file infra/api-stack.yml --stack-name irondog-api \\"
            echo "     --capabilities CAPABILITY_NAMED_IAM"
            exit 1
          fi

      - name: Verify via Lambda invoke
        run: |
          aws lambda invoke --function-name irondog-api \
            --payload '{"version":"2.0","rawPath":"/health","rawQueryString":"","headers":{},"requestContext":{"http":{"method":"GET","path":"/health"}}}' \
            /tmp/invoke.json > /dev/null
          cat /tmp/invoke.json
          echo
          grep -q '"status":"ok"' /tmp/invoke.json

      - name: Verify via API Gateway
        run: |
          curl -fsS https://api.irondog.fit/health | grep '"status":"ok"'