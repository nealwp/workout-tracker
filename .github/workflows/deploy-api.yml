name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'packages/api/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    name: Deploy to AWS Elastic Beanstalk
    runs-on: ubuntu-latest
    
    # This job will be configured later when AWS is set up
    # For now, it just validates the build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Build API
        run: npm run build --workspace=@irondog/api
      
      - name: Package API for deployment
        run: |
          cd packages/api
          # Create deployment package with dist/ and dependencies
          mkdir -p deploy
          cp -r dist package.json package-lock.json deploy/
          cd deploy
          npm ci --production --legacy-peer-deps
          cd ..
          zip -r ../../api-deploy.zip deploy/
          cd ../..
          ls -lh api-deploy.zip
      
      - name: Save deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-deployment-${{ github.sha }}
          path: api-deploy.zip
          retention-days: 7
      
      # TODO: Add Elastic Beanstalk deployment step when AWS is configured
      # - name: Deploy to Elastic Beanstalk
      #   uses: einaregilsson/beanstalk-deploy@v22
      #   with:
      #     aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     application_name: irondog-api
      #     environment_name: irondog-api-prod
      #     version_label: ${{ github.sha }}
      #     region: us-west-2
      #     deployment_package: api-deploy.zip

      - name: Deployment status
        run: |
          echo "✅ API build successful"
          echo "📦 Deployment package created: api-deploy.zip"
          echo ""
          echo "🚀 AWS Elastic Beanstalk deployment will be configured next"
          echo ""
          echo "Next steps:"
          echo "1. Set up Elastic Beanstalk in AWS console (us-west-2)"
          echo "2. Add AWS credentials to GitHub secrets"
          echo "3. Uncomment deployment step above"
          echo "4. Configure custom domain: api.irondog.fit"
